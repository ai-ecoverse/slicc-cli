name: Browser corpus evidence
on:
  pull_request:
    branches: [main]
jobs:
  shared-rows:
    if: github.head_ref == 'bb/guard-118-evidence'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      GOMAXPROCS: 4
      GOFLAGS: -p=4 -race
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - run: npm ci
      - name: Previous guard
        shell: bash
        run: |
          git restore --source=v1.47.2 --worktree internal/caps/cdp
          set +e
          go test -parallel=1 -run '^TestCDPSharedBFCache' -count=1 -timeout=8m -v ./test/integration > previous.log 2>&1
          code=$?
          set -e
          test "$code" -ne 0
          grep -Eq '(commandsUnforwarded|sideEffectAbsent|markerHidden|originHidden): got false' previous.log
          git restore --source=HEAD --worktree internal/caps/cdp
      - name: Current guard
        shell: bash
        run: go test -parallel=1 -run '^TestCDPSharedBFCache' -count=${{ runner.os == 'Windows' && '20' || '1' }} -timeout=40m -v ./test/integration > current.log 2>&1
      - name: Tree response redaction
        shell: bash
        run: go test -parallel=1 -run '^TestCDPQuarantinedTreeReplies' -count=1 -timeout=2m -v ./test/integration > trees.log 2>&1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: corpus-${{ matrix.os }}
          path: '*.log'
