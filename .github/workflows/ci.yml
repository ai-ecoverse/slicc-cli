name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: g0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  g0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Chrome
        run: npx --yes --package @ai-ecoverse/slicc-cdp slicc-cdp install-browser --with-deps
      - name: Measure
        env:
          G0_OUT: ${{ runner.temp }}/g0/slicc-cli-link-guard.json
        run: |
          mkdir -p "$RUNNER_TEMP/g0"
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          nohup Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          for _ in $(seq 50); do [ -S /tmp/.X11-unix/X99 ] && break; sleep 0.2; done
          export DISPLAY=:99
          go test -count=1 -v -timeout 50m -run '^TestG0StockClientsThroughLinkGuard$' ./test/integration/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: g0-slicc-cli
          path: ${{ runner.temp }}/g0/
          if-no-files-found: ignore
