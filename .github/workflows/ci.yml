name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        n: [a, b]
    runs-on: macos-latest
    name: stress (macos-latest, Lagging, ${{ matrix.n }})
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Keep npm's cache to this job's own packages
        shell: bash
        run: echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - shell: bash
        run: go test -race -count=3 -timeout 55m -v -run '^TestCDPProtectVectorsLagging$' ./test/integration/... 2>&1 | tee "$RUNNER_TEMP/out.log" | grep -E 'rows in|timed out|finish in time|GUARD-|--- (PASS|FAIL)|control fail|guarded fail|why ' || true; ! grep -q -- '--- FAIL' "$RUNNER_TEMP/out.log"
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          SLICC_GUARD_VECTORS: '1'
