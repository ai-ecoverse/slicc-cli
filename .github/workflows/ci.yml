name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - run: go test -race -c -o integration.test .
        working-directory: test/integration

      - run: |
          pass=0; fail=0; hang=0
          for i in $(seq 1 15); do
            ./integration.test -test.v -test.count=1 -test.timeout=3m -test.run '^(TestPromptOverTheTrayNextToFollow|TestFollowJerkFlags)$' > run.log 2>&1
            code=$?
            if [ $code -eq 0 ]; then pass=$((pass+1)); elif grep -q "panic: test timed out" run.log; then hang=$((hang+1)); echo "::group::iteration $i hung"; cat run.log; echo "::endgroup::"; else fail=$((fail+1)); echo "::group::iteration $i failed"; cat run.log; echo "::endgroup::"; fi
            grep -E "^(---|    ---) (PASS|FAIL)" run.log | sed "s/^/iter $i: /"
          done
          echo "STRESS shard ${{ matrix.shard }}: pass=$pass fail=$fail hang=$hang"
          echo "STRESS shard ${{ matrix.shard }}: pass=$pass fail=$fail hang=$hang" >> "$GITHUB_STEP_SUMMARY"
        working-directory: test/integration
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

  suite:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - run: go test -race -count=1 -timeout 25m ./test/integration/...
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
