name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, only: '^C3\.', repeat: '6', n: d1, direct: '1' }
          - { os: windows-latest, only: '^C3\.', repeat: '6', n: d2, direct: '1' }
          - { os: windows-latest, only: '^C3\.', repeat: '6', n: d3, direct: '1' }
          - { os: windows-latest, only: '', repeat: '1', n: d4, direct: '1' }
          - { os: windows-latest, only: '', repeat: '1', n: d5, direct: '1' }
          - { os: windows-latest, only: '', repeat: '1', n: s1, direct: '' }
    runs-on: ${{ matrix.os }}
    name: stress (${{ matrix.os }}, ${{ matrix.n }})
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Keep npm's cache to this job's own packages
        shell: bash
        run: echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - shell: bash
        run: go test -race -count=4 -timeout 65m -v -run '^TestCDPProtectVectorsLagging$' ./test/integration/... 2>&1 | tee "$RUNNER_TEMP/out.log" | grep -E 'rows in|timed out|session |GUARD-|--- (PASS|FAIL)|panic' || true; ! grep -q -- '--- FAIL' "$RUNNER_TEMP/out.log"
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          SLICC_GUARD_VECTORS: '1'
          EXP_ONLY: ${{ matrix.only }}
          EXP_REPEAT: ${{ matrix.repeat }}
          EXP_DIRECT: ${{ matrix.direct }}

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: log-${{ matrix.n }}
          path: ${{ runner.temp }}/out.log
