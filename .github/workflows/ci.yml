name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: cloud-run-bench
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          install-only: true

      - run: npm ci

      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name != 'push'
          && '[{"os":"ubuntu-latest","shard":"1/2"},{"os":"ubuntu-latest","shard":"2/2"},{"os":"macos-latest","shard":"1/1"},{"os":"windows-latest","shard":"1/1"}]'
          || '[{"os":"ubuntu-latest","shard":"1/2"},{"os":"ubuntu-latest","shard":"2/2"},{"os":"macos-latest","shard":"1/3"},{"os":"macos-latest","shard":"2/3"},{"os":"macos-latest","shard":"3/3"},{"os":"windows-latest","shard":"1/2"},{"os":"windows-latest","shard":"2/2"}]') }}
    name: test (${{ matrix.os }}, ${{ matrix.shard }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && 'cloud-run-bench' || matrix.os }}
    timeout-minutes: ${{ matrix.shard == '1/1' && 35 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - if: runner.os == 'Windows'
        name: Read Chrome in from the runner's cold disk
        run: |
          $dir = Join-Path $env:ProgramFiles 'Google\Chrome\Application'
          (Get-Item (Join-Path $dir 'chrome.exe')).VersionInfo.ProductVersion
          $files = Get-ChildItem $dir -Recurse -File -ErrorAction Stop
          $took = Measure-Command { foreach ($f in $files) { $null = [IO.File]::ReadAllBytes($f.FullName) } }
          '{0:N0} MB of {1} read in {2:N1} s' -f (($files | Measure-Object Length -Sum).Sum / 1MB), $dir, $took.TotalSeconds

      - run: node scripts/test-shard.mjs ${{ matrix.shard }} ${{ (github.event_name == 'push' || matrix.os == 'ubuntu-latest') && '-race' || '' }} -count=1 -timeout ${{ matrix.shard == '1/1' && '25m' || '12m' }} -v ./test/integration/...
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - if: startsWith(matrix.shard, '1/')
        run: go build -trimpath -o bin/ ./cmd/slicc
        env:
          CGO_ENABLED: '0'

  shellcheck:
    runs-on: cloud-run-bench
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install shellcheck
        env:
          VERSION: v0.11.0
          SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/$VERSION/shellcheck-$VERSION.linux.x86_64.tar.xz"
          echo "$SHA256  $tarball" | sha256sum -c -
          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-$VERSION" >> "$GITHUB_PATH"

      - run: shellcheck -s sh install.sh test/integration/testdata/install/check.sh

  installer-assets:
    runs-on: cloud-run-bench
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - run: scripts/package.sh "0.0.0-ci.$GITHUB_RUN_NUMBER"
        env:
          SLICC_SIGN: '0'

      - name: Stage and check the npm packages
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          node scripts/npm-stage.mjs --version "$VERSION" --companions --wasi
          node scripts/npm-stage.mjs --name sliccy --launcher-only --out dist/npm-next \
            --version "7.0.0-next.$VERSION" --deps-version "$VERSION" --companions
          node scripts/npm-publish.mjs --dry-run
          node scripts/npm-publish.mjs --dir dist/npm-next --tag next --dry-run
          node scripts/sliccy-next.mjs --dry-run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-assets
          path: artifacts/release/
          retention-days: 1

  installer:
    needs: installer-assets
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(github.event_name != 'push'
          && '[{"name":"ubuntu-curl","runner":"cloud-run-bench","container":""},{"name":"alpine-wget","runner":"ubuntu-latest","container":"alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0"}]'
          || '[{"name":"ubuntu-curl","runner":"cloud-run-bench","container":""},{"name":"macos-curl","runner":"macos-latest","container":""},{"name":"alpine-wget","runner":"ubuntu-latest","container":"alpine:3.23@sha256:85fe1e81d6758c208f3e1eed4338a1997e19d4be002d4dd32d3100c9a8c010a0"}]') }}
    name: installer (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: installer-assets
          path: ${{ runner.temp }}/installer/release

      - name: Serve the assets
        env:
          ROOT: ${{ runner.temp }}/installer
        run: |
          nohup python3 -m http.server --bind 127.0.0.1 8765 --directory "$ROOT" > "$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 1 50); do
            curl -fsS -o /dev/null http://127.0.0.1:8765/release/SHA256SUMS && exit 0
            sleep 0.2
          done
          cat "$RUNNER_TEMP/http.log"
          exit 1

      - name: Run the installer checks
        env:
          ROOT: ${{ runner.temp }}/installer
          IMAGE: ${{ matrix.container }}
          CI_VERSION: 0.0.0-ci.${{ github.run_number }}
        run: |
          if [ -z "$IMAGE" ]; then
            sh test/integration/testdata/install/check.sh "$ROOT" http://127.0.0.1:8765 "$CI_VERSION"
          else
            docker run --rm --network host -e SLICC_CHECK_WGET=1 \
              -v "$PWD:/src:ro" -v "$ROOT:$ROOT" "$IMAGE" \
              sh /src/test/integration/testdata/install/check.sh "$ROOT" http://127.0.0.1:8765 "$CI_VERSION"
          fi

  ci:
    if: always()
    needs: [lint, test, shellcheck, installer-assets, installer]
    runs-on: cloud-run-bench
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          RESULTS: lint=${{ needs.lint.result }} test=${{ needs.test.result }} shellcheck=${{ needs.shellcheck.result }} installer-assets=${{ needs.installer-assets.result }} installer=${{ needs.installer.result }}
        run: |
          failed=
          for pair in $RESULTS; do
            echo "$pair"
            [ "${pair#*=}" = success ] || failed="$failed ${pair%%=*}"
          done
          if [ -n "$failed" ]; then
            echo "::error::these jobs did not succeed:$failed"
            exit 1
          fi
