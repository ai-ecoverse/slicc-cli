name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CERT_LIGHT_RUNNER || vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      light: ${{ steps.pick.outputs.light }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_ref || github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/runner.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: pick
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          FORCED: ${{ vars.CI_RUNNER }}
          POOL: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
          LIGHT: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
        with:
          script: |
            const { runner, light, why } = await import(`${process.env.GITHUB_WORKSPACE}/.github/runner.mjs`)
              .then(({ decide }) => decide({ context, github, env: process.env }))
              .catch((error) => ({ runner: 'ubuntu-latest', light: 'ubuntu-latest', why: `the decider failed: ${error.message}` }));
            core.setOutput('runner', runner);
            core.setOutput('light', light);

  stress:
    needs: runner
    strategy:
      fail-fast: false
      matrix:
        include: [{"os":"windows-latest","copy":"w1"},{"os":"windows-latest","copy":"w2"},{"os":"windows-latest","copy":"w3"},{"os":"windows-latest","copy":"w4"},{"os":"windows-latest","copy":"w5"},{"os":"windows-latest","copy":"w6"},{"os":"windows-latest","copy":"w7"},{"os":"windows-latest","copy":"w8"}]
    name: stress (${{ matrix.os }}, ${{ matrix.copy }})
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (needs.runner.outputs.runner || 'ubuntu-latest') || matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Keep npm's cache to this job's own packages
        shell: bash
        run: echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - if: matrix.measure
        name: Time Windows PowerShell's process list, cold and warm
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            s=$(date +%s%N)
            powershell -NoProfile -Command "Get-CimInstance Win32_Process | Select-Object ProcessId, CommandLine | ConvertTo-Json -Compress" > /dev/null; code=$?
            echo "powershell run $i: exit $code in $(( ($(date +%s%N) - s) / 1000000 )) ms"
          done

      - if: ${{ !matrix.measure }}
        shell: bash
        run: |
          set -o pipefail
          go test $FLAGS -count=$COUNT -timeout 70m -run "$RUN" -v $PKGS 2>&1 | tee "$RUNNER_TEMP/stress.log" || true
          echo "== summary"
          grep -E '^--- (PASS|FAIL)' "$RUNNER_TEMP/stress.log" | awk '{print $2, $3}' | sort | uniq -c
          grep -q -E '^(--- FAIL|FAIL|panic:)' "$RUNNER_TEMP/stress.log" && exit 1 || exit 0
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          SLICC_GUARD_VECTORS: '0'
          RUN: '^(TestWasiWatch|TestWasiCommandsOutsideSeven)$'
          COUNT: '100'
          FLAGS: ''
          PKGS: './test/integration/'
