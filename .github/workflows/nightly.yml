name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  report:
    needs: full
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Open, comment on or close the nightly-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.full.result }}
        run: sh scripts/verdict.sh nightly-issue node scripts/nightly-issue.mjs
