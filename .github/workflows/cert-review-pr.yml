name: cert-review-pr

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ ((github.event.action == 'labeled' && github.event.label.name != 'merge-ok' && github.event.label.name != 'cert-review-approved') || (github.event.action == 'unlabeled' && github.event.label.name != 'cert-review-approved') || github.event.action == 'ready_for_review') && format('cert-review-pr-noop-{0}', github.run_id) || format('cert-review-pr-{0}', github.event.pull_request.number || github.event.merge_group.head_sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CERT_CONTEXT: cert-review

jobs:
  guard:
    name: cert-review-pr / self-guard
    if: github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: write
    outputs:
      status: ${{ steps.guard.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: guard
        continue-on-error: true
        uses: ai-ecoverse/slicc-shared-web/.github/actions/cert-self-guard@f342d7cf558c817ce517bbbbc4cc46df6eac2f97
        with:
          approval-label: cert-review-approved
          paths: |
            .github/**
            tools/cert-review/**

  plan:
    name: cert-review-pr / plan
    needs: guard
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      build: ${{ steps.plan.outputs.build }}
      forced: ${{ steps.plan.outputs.forced }}
      version: ${{ steps.versions.outputs.version }}
      commit: ${{ steps.versions.outputs.commit }}
      parent: ${{ steps.versions.outputs.parent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: The trees under test, the pull request merged onto main and its first parent, with main's tools
        run: git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GUARD: ${{ needs.guard.outputs.status }}
        run: |
          node tools/cert-review/pr.mjs plan --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD_SHA" \
            --action "$ACTION" --label "$LABEL" --labels "$LABELS" --run "$GITHUB_RUN_ID" --context "$CERT_CONTEXT" \
            --guard "$GUARD" --approval cert-review-approved
          grep -qE '^build=(true|false)$' "$GITHUB_OUTPUT" || { echo "::error::plan printed no verdict"; exit 1; }

      - id: versions
        if: steps.plan.outputs.build == 'true'
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          latest=$(npm view @ai-ecoverse/slicc dist-tags.latest --prefer-online)
          version=$(node -e 'import("./tools/cert-review/lib.mjs").then((l) => console.log(l.prVersion(process.argv[1], process.argv[2], process.argv[3])))' "$latest" "$PR" "$GITHUB_RUN_ID")
          {
            echo "version=$version"
            echo "commit=$GITHUB_SHA"
            echo "parent=$(git rev-parse "$GITHUB_SHA^1")"
          } | tee -a "$GITHUB_OUTPUT"

      - name: A plan that failed still leaves a status, so the check never waits forever
        if: failure() && (steps.plan.outputs.posted != 'true' || steps.plan.outputs.build == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"error\",\"context\":\"$CERT_CONTEXT\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"cert-review did not finish its plan: re-run the failed jobs\"}" > /dev/null

  build:
    name: cert-review-pr / build ${{ matrix.side }}
    needs: plan
    if: ${{ needs.plan.outputs.build == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        side: [candidate, base]
    outputs:
      sums: ${{ steps.manifest.outputs.sums }}
      candidate-id: ${{ matrix.side == 'candidate' && steps.upload.outputs.artifact-id || '' }}
      candidate-digest: ${{ matrix.side == 'candidate' && steps.upload.outputs.artifact-digest || '' }}
      base-id: ${{ matrix.side == 'base' && steps.upload.outputs.artifact-id || '' }}
      base-digest: ${{ matrix.side == 'base' && steps.upload.outputs.artifact-digest || '' }}
      wasi-id: ${{ matrix.side == 'candidate' && steps.wasi.outputs.artifact-id || '' }}
      wasi-digest: ${{ matrix.side == 'candidate' && steps.wasi.outputs.artifact-digest || '' }}
      wasi-sha256: ${{ matrix.side == 'candidate' && steps.manifest.outputs.wasi || '' }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REF: ${{ matrix.side == 'candidate' && needs.plan.outputs.commit || needs.plan.outputs.parent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: The tree to build, a full clone with its tags as the release has (Go stamps nothing in a linked worktree)
        run: |
          set -euo pipefail
          git init -q tree
          git -C tree remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git -C tree fetch -q --tags origin '+refs/heads/*:refs/remotes/origin/*' "$REF"
          git -C tree checkout -q --detach "$REF"
          git -C tree log -1 --format='%H %s'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: tree/go.mod
          cache-dependency-path: tree/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: The release's own build and staging, unsigned (no secrets in this step)
        working-directory: tree
        run: |
          set -euo pipefail
          SLICC_SIGN=0 scripts/package.sh "$VERSION"
          node scripts/npm-stage.mjs --version "$VERSION" --companions --wasi
          node scripts/npm-stage.mjs --name sliccy --launcher-only --out dist/npm-next \
            --version "7.0.0-next.$VERSION" --deps-version "$VERSION" --companions

      - id: manifest
        name: Every file and npm tarball, hashed by main's tools
        env:
          SIDE: ${{ matrix.side }}
        run: |
          set -euo pipefail
          node tools/cert-review/outputs.mjs manifest --tree tree --version "$VERSION" --commit "$REF" \
            --out "$RUNNER_TEMP/out" > "$RUNNER_TEMP/manifest.log"
          cat "$RUNNER_TEMP/manifest.log"
          if [ "$SIDE" = candidate ]; then
            echo "sums=$(node -p 'require(process.argv[1]).sums' "$RUNNER_TEMP/out/manifest.json")" >> "$GITHUB_OUTPUT"
            echo "wasi=$(node -p 'require(process.argv[1]).packages["@ai-ecoverse/wasi-slicc"].sha256' "$RUNNER_TEMP/out/manifest.json")" >> "$GITHUB_OUTPUT"
          fi

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-build-${{ matrix.side }}-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 7

      - id: wasi
        if: matrix.side == 'candidate'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-build-wasi-slicc-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/out/npm/ai-ecoverse-wasi-slicc-${{ needs.plan.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  classify:
    name: cert-review-pr / classify
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      statuses: write
    outputs:
      go: ${{ steps.classify.outputs.go }}
      behaviour: ${{ steps.classify.outputs.behaviour }}
      bios: ${{ steps.classify.outputs.bios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: dl-base
        if: needs.build.outputs.base-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.build.outputs.base-id }}
          path: ${{ runner.temp }}/builds/base
          digest-mismatch: error

      - id: dl-candidate
        if: needs.build.outputs.candidate-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-id }}
          path: ${{ runner.temp }}/builds/candidate
          digest-mismatch: error

      - id: classify
        name: Behaviour is what ships differently from main's build, plus the workflow and reviewer paths
        env:
          DL_BASE: ${{ steps.dl-base.outcome }}
          DL_CANDIDATE: ${{ steps.dl-candidate.outcome }}
          ARTIFACTS: >-
            cert-build-candidate-${{ needs.plan.outputs.version }}=${{ needs.build.outputs.candidate-id }}:${{ needs.build.outputs.candidate-digest }},
            cert-build-base-${{ needs.plan.outputs.version }}=${{ needs.build.outputs.base-id }}:${{ needs.build.outputs.base-digest }},
            cert-build-wasi-slicc-${{ needs.plan.outputs.version }}=${{ needs.build.outputs.wasi-id }}:${{ needs.build.outputs.wasi-digest }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FORCED: ${{ needs.plan.outputs.forced }}
        run: |
          [ "$DL_BASE" = success ] || rm -rf "$RUNNER_TEMP/builds/base"
          [ "$DL_CANDIDATE" = success ] || rm -rf "$RUNNER_TEMP/builds/candidate"
          node tools/cert-review/pr.mjs classify --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD_SHA" \
            --labels "$LABELS" --forced "$FORCED" --run "$GITHUB_RUN_ID" --context "$CERT_CONTEXT" \
            --artifacts "$ARTIFACTS" --base-manifest "$RUNNER_TEMP/builds/base/manifest.json" \
            --candidate-manifest "$RUNNER_TEMP/builds/candidate/manifest.json"
          grep -q '^posted=true$' "$GITHUB_OUTPUT" || { echo "::error::classify posted no status"; exit 1; }

      - name: A classification that failed still leaves a status, so the check never waits forever
        if: failure() && steps.classify.outputs.posted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"error\",\"context\":\"$CERT_CONTEXT\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"cert-review did not finish classifying: re-run the failed jobs\"}" > /dev/null

  rebuild:
    name: cert-review-pr / rebuild from git archive
    needs: [plan, build, classify]
    if: ${{ !cancelled() && needs.classify.outputs.go == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      rebuild-id: ${{ steps.upload.outputs.artifact-id }}
      rebuild-digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: A git archive of the merge commit, no .git and no tags, in another path on another machine
        run: |
          set -euo pipefail
          git fetch -q --no-tags --depth=1 origin "$COMMIT"
          mkdir -p "$RUNNER_TEMP/archive"
          git archive --format=tar "$COMMIT" | tar -x -C "$RUNNER_TEMP/archive"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ runner.temp }}/archive/go.mod
          cache: false

      - name: The README's recipe (no secrets in this step)
        working-directory: ${{ runner.temp }}/archive
        run: SLICC_SIGN=0 scripts/package.sh "$VERSION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - if: needs.build.outputs.candidate-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-id }}
          path: ${{ runner.temp }}/candidate
          digest-mismatch: error

      - name: Byte for byte against the build job's files
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          node tools/cert-review/outputs.mjs manifest --no-npm --tree "$RUNNER_TEMP/archive" --version "$VERSION" \
            --commit "$COMMIT" --out "$RUNNER_TEMP/rebuild"
          node tools/cert-review/outputs.mjs diff --files-only --base "$RUNNER_TEMP/candidate/manifest.json" \
            --candidate "$RUNNER_TEMP/rebuild/manifest.json" --out "$RUNNER_TEMP/evidence/rebuild.json"

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-review-rebuild-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/rebuild.json
          if-no-files-found: error
          retention-days: 7

  delta:
    name: cert-review-pr / delta
    needs: [plan, classify]
    if: ${{ !cancelled() && needs.classify.outputs.go == 'true' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.delta.outputs.run }}
      delta-id: ${{ steps.upload.outputs.artifact-id }}
      delta-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: delta
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node tools/cert-review/delta.mjs --repo "$GITHUB_REPOSITORY" --pr "$PR" --head "$HEAD_SHA" \
            --out "$RUNNER_TEMP/evidence/delta.json"
          echo "run=$(node -p 'require(process.argv[1]).run' "$RUNNER_TEMP/evidence/delta.json")" >> "$GITHUB_OUTPUT"

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-review-delta-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/delta.json
          if-no-files-found: error
          retention-days: 7

  suite:
    name: cert-review-pr / suite ${{ matrix.which }}
    needs: [plan, classify, delta]
    if: ${{ !cancelled() && needs.classify.outputs.go == 'true' && needs.delta.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        which: [candidate, base]
    outputs:
      candidate-id: ${{ matrix.which == 'candidate' && steps.upload.outputs.artifact-id || '' }}
      candidate-digest: ${{ matrix.which == 'candidate' && steps.upload.outputs.artifact-digest || '' }}
      base-id: ${{ matrix.which == 'base' && steps.upload.outputs.artifact-id || '' }}
      base-digest: ${{ matrix.which == 'base' && steps.upload.outputs.artifact-digest || '' }}
    env:
      WHICH: ${{ matrix.which }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      PARENT: ${{ needs.plan.outputs.parent }}
      RUN: ${{ needs.delta.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: The tree, the pull request on main or main with the pull request's test/ changes
        run: |
          set -euo pipefail
          git fetch -q --no-tags --depth=2 origin "$GITHUB_SHA"
          tree="$RUNNER_TEMP/tree"
          if [ "$WHICH" = candidate ]; then
            git worktree add --detach "$tree" "$COMMIT"
          else
            git worktree add --detach "$tree" "$PARENT"
            git -C "$tree" diff --binary "$PARENT" "$COMMIT" -- test/ > "$RUNNER_TEMP/tests.patch"
            if [ -s "$RUNNER_TEMP/tests.patch" ]; then git -C "$tree" apply "$RUNNER_TEMP/tests.patch"; fi
          fi
          echo "npm_config_cache=$RUNNER_TEMP/npm-cache" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ runner.temp }}/tree/go.mod
          cache-dependency-path: ${{ runner.temp }}/tree/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: The suite's npm pins
        working-directory: ${{ runner.temp }}/tree
        run: npm ci --no-audit --no-fund

      - name: The whole suite on the pull request, or its tests on main, the NEGATIVE (no secrets in this step)
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          SLICC_GUARD_VECTORS: '1'
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/evidence"
          mkdir -p "$ev"
          if [ "$WHICH" = candidate ]; then
            node tools/cert-review/suite.mjs --tree "$RUNNER_TEMP/tree" --out "$ev/candidate" --timeout 45
          elif [ -n "$RUN" ]; then
            node tools/cert-review/suite.mjs --tree "$RUNNER_TEMP/tree" --out "$ev/prev" --run "$RUN" --timeout 30
          else
            printf '{"run":"","exit":0,"complete":true,"pass":0,"fail":0,"skip":0,"results":[]}\n' > "$ev/prev.json"
          fi

      - id: upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-review-suite-${{ matrix.which }}-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/${{ matrix.which == 'candidate' && 'candidate' || 'prev' }}.*
          if-no-files-found: ignore
          retention-days: 7

  bios:
    name: cert-review-pr / bios canary
    needs: [plan, build, classify]
    if: ${{ !cancelled() && needs.classify.outputs.go == 'true' && needs.classify.outputs.bios == 'true' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
      actions: read
    uses: ai-ecoverse/slicc-bios/.github/workflows/canary.yml@b43553b05780d2e2a6d8334688e068a76a67912a
    with:
      bios-ref: b43553b05780d2e2a6d8334688e068a76a67912a
      shards: '["follow-chat"]'
      repeat: 1
      label: bios
      candidate-package: '@ai-ecoverse/wasi-slicc'
      candidate-artifact: cert-build-wasi-slicc-${{ needs.plan.outputs.version }}
      candidate-run: ${{ github.run_id }}
      candidate-repo: ${{ github.repository }}
      candidate-sha256: ${{ needs.build.outputs.wasi-sha256 }}
      candidate-artifact-id: ${{ needs.build.outputs.wasi-id }}
      candidate-artifact-digest: ${{ needs.build.outputs.wasi-digest }}
      candidate-binding: strict

  review:
    name: cert-review-pr / review
    needs: [plan, classify, delta, suite, rebuild]
    if: ${{ !cancelled() && needs.classify.outputs.go == 'true' && needs.delta.result == 'success' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
    outputs:
      key: ${{ steps.key.outputs.present }}
      verdict-id: ${{ steps.upload-verdict.outputs.artifact-id }}
      verdict-digest: ${{ steps.upload-verdict.outputs.artifact-digest }}
      evidence-id: ${{ steps.upload-evidence.outputs.artifact-id }}
      evidence-digest: ${{ steps.upload-evidence.outputs.artifact-digest }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: The runner's own gh, for the reviewer's read-only gh calls (none is ever downloaded here)
        run: |
          if ! command -v gh > /dev/null; then echo "::error::no gh on this runner: the review is INCOMPLETE"; exit 1; fi
          gh --version

      - id: dl-delta
        if: needs.delta.outputs.delta-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.delta.outputs.delta-id }}
          path: ${{ runner.temp }}/art/delta
          digest-mismatch: error

      - id: dl-rebuild
        if: needs.rebuild.outputs.rebuild-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.rebuild.outputs.rebuild-id }}
          path: ${{ runner.temp }}/art/rebuild
          digest-mismatch: error

      - id: dl-suite-candidate
        if: needs.suite.outputs.candidate-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.suite.outputs.candidate-id }}
          path: ${{ runner.temp }}/art/suite-candidate
          digest-mismatch: error

      - id: dl-suite-base
        if: needs.suite.outputs.base-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.suite.outputs.base-id }}
          path: ${{ runner.temp }}/art/suite-base
          digest-mismatch: error

      - name: Findings, in code, from each producer's own evidence only
        id: findings
        env:
          BEHAVIOUR: ${{ needs.classify.outputs.behaviour }}
          DOWNLOADS: >-
            delta=${{ steps.dl-delta.outcome }},rebuild=${{ steps.dl-rebuild.outcome }},
            suite-candidate=${{ steps.dl-suite-candidate.outcome }},suite-base=${{ steps.dl-suite-base.outcome }}
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/evidence"
          mkdir -p "$ev/logs" "$RUNNER_TEMP/cert-review"
          node tools/cert-review/gather.mjs --in "$RUNNER_TEMP/art" --downloads "$DOWNLOADS" --out "$ev"
          printf '%s\n' "$BEHAVIOUR" | tr ',' '\n' > "$ev/classify.txt"
          node tools/cert-review/findings.mjs --delta "$ev/delta.json" --candidate "$ev/candidate.json" \
            --prev "$ev/prev.json" --rebuild "$ev/rebuild.json" --out "$ev/findings.json"
          {
            echo 'prompt<<CERT_PROMPT_END'
            EVIDENCE="$ev" OUT="$RUNNER_TEMP/cert-review" node tools/cert-review/prompt.mjs
            echo 'CERT_PROMPT_END'
          } >> "$GITHUB_OUTPUT"

      - name: The reviewer's key is there, or the line is INCOMPLETE
        id: key
        env:
          PRESENT: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK != '' }}
        run: |
          echo "present=$PRESENT" >> "$GITHUB_OUTPUT"
          if [ "$PRESENT" != true ]; then echo "::warning title=cert-review::INCOMPLETE: no reviewer key"; fi

      - name: Review
        id: review
        if: steps.key.outputs.present == 'true'
        uses: anthropics/claude-code-action/base-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION: ${{ vars.CERT_AWS_REGION || 'us-west-2' }}
          GH_TOKEN: ${{ github.token }}
        with:
          use_bedrock: 'true'
          claude_args: |
            --model ${{ vars.CERT_BEDROCK_MODEL || 'global.anthropic.claude-opus-5-5' }}
            --allowedTools "Read,Write,Glob,Grep,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --max-turns 200
          prompt: ${{ steps.findings.outputs.prompt }}

      - name: Evidence
        if: ${{ !cancelled() }}
        env:
          EXECUTION: ${{ steps.review.outputs.execution_file }}
        run: |
          cp "${EXECUTION:-/dev/null}" "$RUNNER_TEMP/evidence/claude-turns.json" 2> /dev/null || true
          mkdir -p "$RUNNER_TEMP/cert-review"
          cp -r "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/evidence/" 2> /dev/null || true

      - id: upload-verdict
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-verdict-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/cert-review/verdict.json
            ${{ runner.temp }}/cert-review/comment.md
          if-no-files-found: ignore
          retention-days: 7

      - id: upload-evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-evidence-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: ignore
          retention-days: 7

  record:
    name: cert-review-pr / record
    needs: [plan, build, classify, rebuild, delta, suite, review, bios]
    if: ${{ !cancelled() && needs.classify.outputs.go == 'true' && needs.review.result != 'cancelled' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    permissions:
      actions: read
      contents: read
      checks: read
      issues: read
      pull-requests: read
    outputs:
      conclusion: ${{ steps.record.outputs.conclusion }}
      line: ${{ steps.record.outputs.line }}
      record-id: ${{ steps.upload.outputs.artifact-id }}
      record-digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SUMS: ${{ needs.build.outputs.sums }}
      REVIEW: ${{ needs.review.result }}
      KEY: ${{ needs.review.outputs.key }}
      BIOS: ${{ needs.classify.outputs.bios }}
      BIOS_JOB: ${{ needs.bios.result }}
      BIOS_ARTIFACT: ${{ needs.bios.outputs.artifact-id }}:${{ needs.bios.outputs.artifact-digest }}
      JOBS: build=${{ needs.build.result }},rebuild=${{ needs.rebuild.result }},delta=${{ needs.delta.result }},suite=${{ needs.suite.result }}
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: dl-verdict
        if: needs.review.outputs.verdict-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.review.outputs.verdict-id }}
          path: ${{ runner.temp }}/cert-review
          digest-mismatch: error

      - id: dl-build
        if: needs.build.outputs.candidate-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.build.outputs.candidate-id }}
          path: ${{ runner.temp }}/build
          digest-mismatch: error

      - id: dl-delta
        if: needs.delta.outputs.delta-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.delta.outputs.delta-id }}
          path: ${{ runner.temp }}/art/delta
          digest-mismatch: error

      - id: dl-rebuild
        if: needs.rebuild.outputs.rebuild-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.rebuild.outputs.rebuild-id }}
          path: ${{ runner.temp }}/art/rebuild
          digest-mismatch: error

      - id: dl-suite-candidate
        if: needs.suite.outputs.candidate-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.suite.outputs.candidate-id }}
          path: ${{ runner.temp }}/art/suite-candidate
          digest-mismatch: error

      - id: dl-suite-base
        if: needs.suite.outputs.base-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.suite.outputs.base-id }}
          path: ${{ runner.temp }}/art/suite-base
          digest-mismatch: error

      - id: dl-bios
        if: needs.bios.outputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.bios.outputs.artifact-id }}
          path: ${{ runner.temp }}/bios
          digest-mismatch: error

      - name: The line, from the build, the findings recomputed here from the code-made evidence, CI's results on the head and the verdict
        id: record
        env:
          DOWNLOADS: >-
            verdict=${{ steps.dl-verdict.outcome }},build=${{ steps.dl-build.outcome }},
            delta=${{ steps.dl-delta.outcome }},rebuild=${{ steps.dl-rebuild.outcome }},
            suite-candidate=${{ steps.dl-suite-candidate.outcome }},suite-base=${{ steps.dl-suite-base.outcome }},
            bios=${{ steps.dl-bios.outcome }}
          ARTIFACTS: >-
            cert-build-candidate-${{ needs.plan.outputs.version }}=${{ needs.build.outputs.candidate-id }}:${{ needs.build.outputs.candidate-digest }},
            cert-build-base-${{ needs.plan.outputs.version }}=${{ needs.build.outputs.base-id }}:${{ needs.build.outputs.base-digest }},
            cert-build-wasi-slicc-${{ needs.plan.outputs.version }}=${{ needs.build.outputs.wasi-id }}:${{ needs.build.outputs.wasi-digest }},
            cert-review-rebuild-${{ needs.plan.outputs.version }}=${{ needs.rebuild.outputs.rebuild-id }}:${{ needs.rebuild.outputs.rebuild-digest }},
            cert-review-delta-${{ needs.plan.outputs.version }}=${{ needs.delta.outputs.delta-id }}:${{ needs.delta.outputs.delta-digest }},
            cert-review-suite-candidate-${{ needs.plan.outputs.version }}=${{ needs.suite.outputs.candidate-id }}:${{ needs.suite.outputs.candidate-digest }},
            cert-review-suite-base-${{ needs.plan.outputs.version }}=${{ needs.suite.outputs.base-id }}:${{ needs.suite.outputs.base-digest }},
            cert-verdict-${{ needs.plan.outputs.version }}=${{ needs.review.outputs.verdict-id }}:${{ needs.review.outputs.verdict-digest }},
            cert-evidence-${{ needs.plan.outputs.version }}=${{ needs.review.outputs.evidence-id }}:${{ needs.review.outputs.evidence-digest }}
        run: |
          ev="$RUNNER_TEMP/evidence"
          mkdir -p "$RUNNER_TEMP/cert-review" "$RUNNER_TEMP/build" "$ev"
          node tools/cert-review/gather.mjs --in "$RUNNER_TEMP/art" --downloads "$DOWNLOADS" --out "$ev"
          node tools/cert-review/findings.mjs --delta "$ev/delta.json" --candidate "$ev/candidate.json" \
            --prev "$ev/prev.json" --rebuild "$ev/rebuild.json" --out "$RUNNER_TEMP/findings.json"
          if node tools/cert-review/record.mjs --version "$VERSION" --repo "$GITHUB_REPOSITORY" --pr "$PR" \
            --head "$HEAD_SHA" --commit "$COMMIT" --run "$RUN_URL" --artifact "$RUNNER_TEMP/build" --sums "$SUMS" \
            --findings "$RUNNER_TEMP/findings.json" --review "$RUNNER_TEMP/cert-review" \
            --review-result "$REVIEW" --jobs "$JOBS" --key "${KEY:-false}" --run-id "$GITHUB_RUN_ID" --artifacts "$ARTIFACTS" \
            --downloads "$DOWNLOADS" --bios "$BIOS" --bios-job "$BIOS_JOB" --bios-artifact "$BIOS_ARTIFACT" \
            --bios-dir "$RUNNER_TEMP/bios" --ci-wait 3600 --out "$RUNNER_TEMP/record"; then
            ok=true
          else
            ok=false
          fi
          line=$(head -1 "$RUNNER_TEMP/record/line.txt" 2> /dev/null || true)
          state=$(node -p 'require(process.argv[1]).state || ""' "$RUNNER_TEMP/record/record.json" 2> /dev/null || true)
          if [ "$ok" = true ] && [ "$state" = success ] && [[ "$line" == "certified "* ]]; then
            conclusion=success
          elif [ -z "$line" ] || [ -z "$state" ] || [ "$state" = success ]; then
            conclusion=error
            line="cert-ci: INCOMPLETE #$PR: record printed no verdict (re-run the failed jobs)"
          else
            conclusion=$state
          fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "line=$line" >> "$GITHUB_OUTPUT"
          { echo '```'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-record-${{ needs.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/record/record.json
            ${{ runner.temp }}/record/line.txt
            ${{ runner.temp }}/record/body.md
          if-no-files-found: error
          retention-days: 30

  report:
    name: cert-review-pr / report
    needs: [plan, classify, record]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.classify.outputs.go == 'true' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CONCLUSION: ${{ needs.record.outputs.conclusion }}
      LINE: ${{ needs.record.outputs.line }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: dl-record
        if: needs.record.outputs.record-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          artifact-ids: ${{ needs.record.outputs.record-id }}
          path: ${{ runner.temp }}/record
          digest-mismatch: error


      - name: The verdict as the status on the pull request's head, and in a comment
        env:
          DL_RECORD: ${{ steps.dl-record.outcome }}
        run: |
          set -euo pipefail
          [ "${DL_RECORD:-}" = success ] || rm -rf "$RUNNER_TEMP/record"
          state=${CONCLUSION:-error}
          line=${LINE:-"cert-ci: INCOMPLETE #$PR: no record (re-run the failed jobs)"}
          if [ "$state" = success ] && [[ "$line" != "certified "* ]]; then
            state=error
            line="cert-ci: INCOMPLETE #$PR: the record printed no certified line (re-run the failed jobs)"
          fi
          desc=$(printf '%s' "$line" | cut -c1-140)
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GH_REPO/statuses/$HEAD_SHA" \
            -d "$(node -e 'console.log(JSON.stringify({ state: process.argv[1], context: process.argv[2], target_url: process.argv[3], description: process.argv[4] }))' "$state" "$CERT_CONTEXT" "$RUN_URL" "$desc")" > /dev/null
          echo "$CERT_CONTEXT $state on $HEAD_SHA: $line"
          { echo '```'; echo "$line"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          body="$RUNNER_TEMP/record/body.md"
          [ -f "$body" ] || printf '%s\n' '<!-- cert-review -->' "$line" '<!-- /cert-review -->' > "$body"
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- cert-review -->")) | .id' | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$body" > /dev/null
          fi
          if [ "$state" != success ]; then echo "::error title=cert-review::$line"; exit 1; fi

  group:
    name: cert-review-pr / merge group
    needs: guard
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - id: lookup
        name: Each pull request in the group has a green status on the head being merged
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GUARD: ${{ needs.guard.outputs.status }}
        run: |
          node tools/cert-review/pr.mjs lookup --repo "$GITHUB_REPOSITORY" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --run "$GITHUB_RUN_ID" --context "$CERT_CONTEXT" --guard "$GUARD" --approval cert-review-approved
          grep -q '^posted=true$' "$GITHUB_OUTPUT" || { echo "::error::the lookup posted no status"; exit 1; }

      - name: A lookup that failed still leaves a status, so the check never waits forever
        if: failure() && steps.lookup.outputs.posted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -d "{\"state\":\"error\",\"context\":\"$CERT_CONTEXT\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\",\"description\":\"cert-review did not finish its lookup: re-run the failed jobs\"}" > /dev/null
