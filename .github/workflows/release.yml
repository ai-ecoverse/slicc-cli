name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .releaserc.json
      - scripts/go-*
      - scripts/is-main.mjs
      - scripts/verdict.sh
      - scripts/npm-*.mjs
      - scripts/release-issue.mjs
      - scripts/package.sh
      - scripts/release-plan.mjs
      - scripts/sliccy-next.mjs
  workflow_dispatch:
    inputs:
      sliccy_next_only:
        description: Publish only sliccy@7.0.0-next.<latest release> to next, without a new release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || github.event.workflow_run.conclusion != 'success') && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.sliccy_next_only }}
    name: CI on this commit
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: push
        run: |
          url="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=$EVENT&per_page=1"
          start=$(date +%s)
          while :; do
            run="$(gh api "$url" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"' || true)"
            status="${run%% *}"
            if [ -z "$run" ]; then
              if [ $(( $(date +%s) - start )) -gt 600 ]; then
                echo "::error::no CI run ($EVENT) for $SHA after 10 minutes"
                exit 1
              fi
            elif [ "$status" = completed ]; then
              rest="${run#* }"
              conclusion="${rest%% *}"
              echo "CI for $SHA: $conclusion ${rest#* }"
              if [ "$conclusion" = success ]; then exit 0; fi
              echo "::error::CI for $SHA ended $conclusion; re-run its failed jobs, then re-run this workflow"
              exit 1
            else
              echo "CI for $SHA: $run"
            fi
            sleep 30
          done

  fresh:
    if: >-
      ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    name: Still the head of main
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      verdict: ${{ steps.head.outputs.verdict }}
    steps:
      - name: Compare the tested commit with main
        id: head
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head="$(git ls-remote "$REPO" refs/heads/main | cut -f1)" || head=""
          if [ -n "$head" ] && [ "$head" != "$SHA" ]; then
            echo "fresh: PASS stale: main is at $head, past $SHA; the newer commit's CI releases"
            echo "verdict=stale" >> "$GITHUB_OUTPUT"
          elif [ -z "$head" ]; then
            echo "fresh: PASS unknown (semantic-release decides): git ls-remote could not read main; releasing $SHA"
            echo "verdict=unknown" >> "$GITHUB_OUTPUT"
          else
            echo "fresh: PASS current: main is at $head; releasing $SHA"
            echo "verdict=current" >> "$GITHUB_OUTPUT"
          fi

  full:
    needs: [ci, fresh]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && !inputs.sliccy_next_only && needs.ci.result == 'success'
      || github.event_name == 'workflow_run' && (needs.fresh.outputs.verdict == 'current' || needs.fresh.outputs.verdict == 'unknown')) }}
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  build:
    needs: [ci, fresh]
    if: >-
      ${{ !cancelled() && (github.event_name != 'workflow_run' || needs.fresh.outputs.verdict == 'current' || needs.fresh.outputs.verdict == 'unknown') && (needs.ci.result == 'success' || github.event_name == 'pull_request' || github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    env:
      DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - run: npm ci

      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "version=0.0.0-dry-run.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            sh scripts/verdict.sh release-plan node scripts/release-plan.mjs
          fi

      - name: Build unsigned
        if: steps.plan.outputs.version != '' && env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SLICC_SIGN: '0'
        run: scripts/package.sh "$VERSION"

      - name: Build and sign
        if: steps.plan.outputs.version != '' && env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: scripts/package.sh "$VERSION"

      - name: Stage npm packages
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node scripts/npm-stage.mjs --version "$VERSION" --companions --wasi
          node scripts/npm-stage.mjs --name sliccy --launcher-only --out dist/npm-next \
            --version "7.0.0-next.$VERSION" --deps-version "$VERSION" --companions

      - name: Check npm packages
        if: steps.plan.outputs.version != '' && env.DRY_RUN == 'true'
        run: |
          sh scripts/verdict.sh npm-publish node scripts/npm-publish.mjs --dry-run
          sh scripts/verdict.sh npm-publish node scripts/npm-publish.mjs --dir dist/npm-next --tag next --dry-run
          sh scripts/verdict.sh sliccy-next node scripts/sliccy-next.mjs --dry-run

      - name: Pack what the release publishes, keeping file modes
        if: steps.plan.outputs.version != ''
        run: tar -cf slicc-release.tar dist/VERSION artifacts/release dist/npm dist/npm-next

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.plan.outputs.version != ''
        with:
          name: slicc-release
          path: slicc-release.tar
          retention-days: 7

  release:
    needs: [build, full, smoke]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.build.result == 'success' && needs.build.outputs.version != ''
      && needs.full.result == 'success' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.published.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: slicc-release

      - name: Unpack the build
        id: built
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tar -xf slicc-release.tar
          rm slicc-release.tar
          test "$(cat dist/VERSION)" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: github.ref == 'refs/heads/main'
        with:
          subject-checksums: artifacts/release/SHA256SUMS

      - name: Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLICC_NPM_PUBLISH: ${{ vars.SLICC_NPM_PUBLISH }}
          SLICCY_NEXT_PUBLISH: ${{ vars.SLICCY_NEXT_PUBLISH }}
          WASI_SLICC_PUBLISH: ${{ vars.WASI_SLICC_PUBLISH }}
        run: npx semantic-release

      - name: Check that semantic-release published the version on this commit
        id: published
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.built.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="refs/tags/v$VERSION"
          refs="$(git ls-remote origin "$tag" "$tag^{}")"
          at="$(printf '%s\n' "$refs" | awk -v t="$tag" '$2 == t { c = $1 } $2 == t "^{}" { p = $1 } END { print (p != "" ? p : c) }')"
          if [ "$at" = "$SHA" ]; then
            echo "published: PASS v$VERSION is tagged on $SHA"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          elif [ -z "$at" ]; then
            echo "published: PASS nothing published: no tag v$VERSION; install-smoke and sliccy-next skip"
          else
            echo "published: PASS nothing published: v$VERSION is tagged on $at, not $SHA; install-smoke and sliccy-next skip"
          fi

      - name: Warm the Go module proxy
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/go-warm.sh "$VERSION"

  sliccy-next:
    needs: release
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' && inputs.sliccy_next_only
      || github.event_name != 'pull_request' && needs.release.result == 'success' && needs.release.outputs.version != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Publish sliccy@next for the latest release, once npm serves its platform packages
        env:
          SLICCY_NEXT_PUBLISH: ${{ vars.SLICCY_NEXT_PUBLISH }}
          SLICC_REGISTRY_WAIT_SECONDS: '3600'
        run: sh scripts/verdict.sh sliccy-next node scripts/sliccy-next.mjs

  smoke:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.version != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: slicc-darwin-arm64
          - runner: macos-15-intel
            asset: slicc-darwin-amd64
          - runner: pool
            asset: slicc-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: slicc-linux-arm64
          - runner: windows-latest
            asset: slicc-windows-amd64.exe
          - runner: windows-11-arm
            asset: slicc-windows-arm64.exe
    runs-on: ${{ matrix.runner == 'pool' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CERT_RUNNER || 'ubuntu-latest') || matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: slicc-release

      - name: Run the binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tar -xf slicc-release.tar artifacts/release
          cd artifacts/release
          grep " $ASSET\$" SHA256SUMS > one.sum
          if command -v sha256sum >/dev/null; then sha256sum -c one.sum; else shasum -a 256 -c one.sum; fi
          chmod +x "$ASSET"
          out="$("./$ASSET" --version)"
          echo "$out"
          test "$out" = "slicc $VERSION"

  install-smoke:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-curl
            runner: pool
            container: ''
          - name: macos-curl
            runner: macos-latest
            container: ''
          - name: alpine-wget
            runner: ubuntu-latest
            container: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    name: install-smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner == 'pool' && (vars.CERT_RUNNER || 'ubuntu-latest') || matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Run the documented one-liner against releases/latest
        env:
          IMAGE: ${{ matrix.container }}
          WANT: slicc ${{ needs.release.outputs.version }}
        run: |
          url=https://github.com/ai-ecoverse/slicc-cli/releases/latest/download/install.sh
          if [ -z "$IMAGE" ]; then
            curl -fsSL "$url" | sh
            got="$("$HOME/.local/bin/slicc" --version)"
          else
            got="$(docker run --rm -e URL="$url" "$IMAGE" sh -c 'wget -qO- "$URL" | sh >&2 && "$HOME/.local/bin/slicc" --version')"
          fi
          echo "$got"
          test "$got" = "$WANT"

  report:
    needs: [full, build, smoke, release, sliccy-next, install-smoke]
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.full.result != 'skipped' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Open, comment on or close the release-red issue
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RESULTS: full=${{ needs.full.result }} build=${{ needs.build.result }} smoke=${{ needs.smoke.result }} release=${{ needs.release.result }} sliccy-next=${{ needs.sliccy-next.result }} install-smoke=${{ needs.install-smoke.result }}
        run: sh scripts/verdict.sh release-issue node scripts/release-issue.mjs
