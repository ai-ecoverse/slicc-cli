name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - if: env.DRY_RUN != 'true'
        run: npm test

      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "version=0.0.0-dry-run.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            node scripts/release-plan.mjs
          fi

      - name: Build unsigned
        if: steps.plan.outputs.version != '' && env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SLICC_SIGN: '0'
        run: scripts/package.sh "$VERSION"

      - name: Build and sign
        if: steps.plan.outputs.version != '' && env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
        run: scripts/package.sh "$VERSION"

      - name: Stage npm packages
        if: steps.plan.outputs.version != ''
        run: node scripts/npm-stage.mjs --version "${{ steps.plan.outputs.version }}"

      - name: Check npm packages
        if: steps.plan.outputs.version != '' && env.DRY_RUN == 'true'
        run: node scripts/npm-publish.mjs --dry-run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.plan.outputs.version != ''
        with:
          name: slicc-release
          path: |
            artifacts/release/
            dist/npm/
          retention-days: 7

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: steps.plan.outputs.version != '' && env.DRY_RUN != 'true'
        with:
          subject-checksums: artifacts/release/SHA256SUMS

      - name: Release
        if: steps.plan.outputs.version != '' && env.DRY_RUN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLICC_NPM_PUBLISH: ${{ vars.SLICC_NPM_PUBLISH }}
        run: npx semantic-release

  smoke:
    needs: release
    if: needs.release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: slicc-darwin-arm64
          - runner: macos-15-intel
            asset: slicc-darwin-amd64
          - runner: ubuntu-latest
            asset: slicc-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: slicc-linux-arm64
          - runner: windows-latest
            asset: slicc-windows-amd64.exe
          - runner: windows-11-arm
            asset: slicc-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: slicc-release

      - name: Run the binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd artifacts/release
          grep " $ASSET\$" SHA256SUMS > one.sum
          if command -v sha256sum >/dev/null; then sha256sum -c one.sum; else shasum -a 256 -c one.sum; fi
          chmod +x "$ASSET"
          out="$("./$ASSET" --version)"
          echo "$out"
          test "$out" = "slicc $VERSION"
