name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .releaserc.json
      - scripts/go-*
      - scripts/npm-*.mjs
      - scripts/package.sh
      - scripts/release-plan.mjs
      - scripts/sliccy-next.mjs
  workflow_dispatch:
    inputs:
      sliccy_next_only:
        description: Publish only sliccy@7.0.0-next.<latest release> to next, without a new release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || github.event.workflow_run.conclusion != 'success') && github.run_id || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.sliccy_next_only }}
    name: CI on this commit
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    permissions:
      actions: read
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: push
        run: |
          url="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=$EVENT&per_page=1"
          start=$(date +%s)
          while :; do
            run="$(gh api "$url" --jq '.workflow_runs[0] // empty | "\(.status) \(.conclusion) \(.html_url)"' || true)"
            status="${run%% *}"
            if [ -z "$run" ]; then
              if [ $(( $(date +%s) - start )) -gt 600 ]; then
                echo "::error::no CI run ($EVENT) for $SHA after 10 minutes"
                exit 1
              fi
            elif [ "$status" = completed ]; then
              rest="${run#* }"
              conclusion="${rest%% *}"
              echo "CI for $SHA: $conclusion ${rest#* }"
              if [ "$conclusion" = success ]; then exit 0; fi
              echo "::error::CI for $SHA ended $conclusion; re-run its failed jobs, then re-run this workflow"
              exit 1
            else
              echo "CI for $SHA: $run"
            fi
            sleep 30
          done

  fresh:
    if: >-
      ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
    name: Still the head of main
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    outputs:
      stale: ${{ steps.head.outputs.stale }}
    steps:
      - name: Compare the tested commit with main
        id: head
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head="$(git ls-remote "$REPO" refs/heads/main | cut -f1)" || head=""
          if [ -n "$head" ] && [ "$head" != "$SHA" ]; then
            echo "main is at $head, past $SHA; the newer commit's CI releases"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is at ${head:-an unknown commit}; releasing $SHA"
          fi

  release:
    needs: [ci, fresh]
    if: >-
      ${{ !cancelled() && needs.fresh.outputs.stale != 'true' && (needs.ci.result == 'success' || github.event_name == 'pull_request' || github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
    env:
      DRY_RUN: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - run: npm ci

      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "version=0.0.0-dry-run.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            node scripts/release-plan.mjs
          fi

      - name: Build unsigned
        if: steps.plan.outputs.version != '' && env.DRY_RUN == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SLICC_SIGN: '0'
        run: scripts/package.sh "$VERSION"

      - name: Build and sign
        if: steps.plan.outputs.version != '' && env.DRY_RUN != 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: scripts/package.sh "$VERSION"

      - name: Stage npm packages
        if: steps.plan.outputs.version != ''
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          node scripts/npm-stage.mjs --version "$VERSION" --companions --wasi
          node scripts/npm-stage.mjs --name sliccy --launcher-only --out dist/npm-next \
            --version "7.0.0-next.$VERSION" --deps-version "$VERSION" --companions

      - name: Check npm packages
        if: steps.plan.outputs.version != '' && env.DRY_RUN == 'true'
        run: |
          node scripts/npm-publish.mjs --dry-run
          node scripts/npm-publish.mjs --dir dist/npm-next --tag next --dry-run
          node scripts/sliccy-next.mjs --dry-run

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.plan.outputs.version != ''
        with:
          name: slicc-release
          path: |
            artifacts/release/
            dist/npm/
            dist/npm-next/
          retention-days: 7

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: steps.plan.outputs.version != '' && env.DRY_RUN != 'true' && github.ref == 'refs/heads/main'
        with:
          subject-checksums: artifacts/release/SHA256SUMS

      - name: Release
        if: steps.plan.outputs.version != '' && env.DRY_RUN != 'true' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLICC_NPM_PUBLISH: ${{ vars.SLICC_NPM_PUBLISH }}
          SLICCY_NEXT_PUBLISH: ${{ vars.SLICCY_NEXT_PUBLISH }}
          WASI_SLICC_PUBLISH: ${{ vars.WASI_SLICC_PUBLISH }}
        run: npx semantic-release

      - name: Warm the Go module proxy
        if: ${{ !cancelled() && steps.plan.outputs.version != '' && env.DRY_RUN != 'true' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: scripts/go-warm.sh "$VERSION"

  sliccy-next:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sliccy_next_only && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Publish sliccy@next for the latest release
        env:
          SLICCY_NEXT_PUBLISH: ${{ vars.SLICCY_NEXT_PUBLISH }}
        run: node scripts/sliccy-next.mjs

  smoke:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            asset: slicc-darwin-arm64
          - runner: macos-15-intel
            asset: slicc-darwin-amd64
          - runner: pool
            asset: slicc-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: slicc-linux-arm64
          - runner: windows-latest
            asset: slicc-windows-amd64.exe
          - runner: windows-11-arm
            asset: slicc-windows-arm64.exe
    runs-on: ${{ matrix.runner == 'pool' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CERT_RUNNER || 'ubuntu-latest') || matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: slicc-release

      - name: Run the binary
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          cd artifacts/release
          grep " $ASSET\$" SHA256SUMS > one.sum
          if command -v sha256sum >/dev/null; then sha256sum -c one.sum; else shasum -a 256 -c one.sum; fi
          chmod +x "$ASSET"
          out="$("./$ASSET" --version)"
          echo "$out"
          test "$out" = "slicc $VERSION"

  install-smoke:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-curl
            runner: pool
            container: ''
          - name: macos-curl
            runner: macos-latest
            container: ''
          - name: alpine-wget
            runner: ubuntu-latest
            container: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    name: install-smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner == 'pool' && (vars.CERT_RUNNER || 'ubuntu-latest') || matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Run the documented one-liner against releases/latest
        env:
          IMAGE: ${{ matrix.container }}
          WANT: slicc ${{ needs.release.outputs.version }}
        run: |
          url=https://github.com/ai-ecoverse/slicc-cli/releases/latest/download/install.sh
          if [ -z "$IMAGE" ]; then
            curl -fsSL "$url" | sh
            got="$("$HOME/.local/bin/slicc" --version)"
          else
            got="$(docker run --rm -e URL="$url" "$IMAGE" sh -c 'wget -qO- "$URL" | sh >&2 && "$HOME/.local/bin/slicc" --version')"
          fi
          echo "$got"
          test "$got" = "$WANT"

  verify-rebuild:
    name: release / reproduce from the tag
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - name: A git archive of the tag, no .git and no tags, on another OS than the release's
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          mkdir -p "$RUNNER_TEMP/archive"
          git archive --format=tar "v$VERSION" | tar -x -C "$RUNNER_TEMP/archive"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ runner.temp }}/archive/go.mod
          cache: false

      - name: The README's recipe
        working-directory: ${{ runner.temp }}/archive
        run: SLICC_SIGN=0 scripts/package.sh "$VERSION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Every linux, windows and wasm asset and install.sh byte for byte against the release's SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          curl -fsSL -o "$RUNNER_TEMP/release-sums" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/SHA256SUMS"
          verdict=$(node tools/cert-review/outputs.mjs reproduce --release "$RUNNER_TEMP/release-sums" \
            --rebuilt "$RUNNER_TEMP/archive/artifacts/release/SHA256SUMS" --out "$RUNNER_TEMP/evidence/rebuild.json")
          echo "$verdict"
          case "$verdict" in
            "reproduced "* | "different: "*) ;;
            *) echo "::error::the reproduction printed no verdict"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-verify-rebuild
          path: ${{ runner.temp }}/evidence/rebuild.json
          if-no-files-found: error
          retention-days: 30

  verify-darwin:
    name: release / darwin signature and notarization
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' && github.ref == 'refs/heads/main' }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: codesign and Gatekeeper on the published darwin binaries
        env:
          TEAM: ${{ vars.CERT_APPLE_TEAM || 'S8LB56P782' }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p 'slicc-darwin-*' --dir "$RUNNER_TEMP/darwin"
          verdict=$(node tools/cert-review/darwin.mjs --dir "$RUNNER_TEMP/darwin" --team "$TEAM" --out "$RUNNER_TEMP/evidence/darwin.json")
          echo "$verdict"
          for asset in slicc-darwin-arm64 slicc-darwin-amd64; do
            echo "$verdict" | grep -qE "^$asset: (PASS|FAIL|INCOMPLETE)" || { echo "::error::the darwin check printed no verdict for $asset"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-verify-darwin
          path: ${{ runner.temp }}/evidence/darwin.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: release / verify on npm
    needs: [release, verify-rebuild, verify-darwin]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.version != '' && github.ref == 'refs/heads/main' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: write
      attestations: read
      issues: read
      pull-requests: read
      statuses: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: The runner's own gh (none is ever downloaded here)
        run: |
          if ! command -v gh > /dev/null; then echo "::error::no gh on this runner: verify is INCOMPLETE"; exit 1; fi
          gh --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: cert-verify-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: true

      - name: The release on npm and GitHub is what release.yml built from the tag on main, and its notes carry the certified lines
        env:
          SLICC_NPM_PUBLISH: ${{ vars.SLICC_NPM_PUBLISH }}
          SLICCY_NEXT_PUBLISH: ${{ vars.SLICCY_NEXT_PUBLISH }}
          WASI_SLICC_PUBLISH: ${{ vars.WASI_SLICC_PUBLISH }}
        run: |
          set -o pipefail
          node tools/cert-review/verify.mjs --repo "$GITHUB_REPOSITORY" --version "$VERSION" --run "$GITHUB_RUN_ID" \
            --wait 3600 --evidence "$RUNNER_TEMP/evidence" --out "$RUNNER_TEMP/verify.json" | tee "$RUNNER_TEMP/verify.log"
          grep -qE "^certified slicc-cli@$VERSION binaries SHA256SUMS sha256=[0-9a-f]{64} " "$RUNNER_TEMP/verify.log" || {
            echo "::error title=verify on npm::verify printed no certified line for slicc-cli@$VERSION"
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cert-verify-record
          path: ${{ runner.temp }}/verify.json
          if-no-files-found: ignore
          retention-days: 30
