name: exp guard macos

on:
  pull_request:

permissions:
  contents: read

jobs:
  direct:
    strategy:
      fail-fast: false
      matrix:
        extra: ['', '--disable-renderer-backgrounding', '--disable-backgrounding-occluded-windows']
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - run: node scripts/exp-c6.mjs
        env:
          EXTRA: ${{ matrix.extra }}
