name: cert-verify

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: A released version (x.y.z) to verify again
        required: true

permissions:
  contents: read

concurrency:
  group: cert-verify-${{ github.event.workflow_run.head_sha || inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    name: release / which release
    if: >-
      ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
      && (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch')) }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - id: tag
        name: The version tagged on the commit the release run built, or the one asked for
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT" ]; then
            [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$INPUT isn't x.y.z"; exit 1; }
            version=$INPUT
          else
            version=$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" 'refs/tags/v*' \
              | awk -v sha="$SHA" '$1 == sha { n = $2; sub("^refs/tags/v", "", n); sub("\\^\\{\\}$", "", n); print n }' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release: ${version:-none on $SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

  rebuild:
    name: release / reproduce from the tag
    needs: tag
    if: ${{ !cancelled() && needs.tag.outputs.version != '' }}
    runs-on: ${{ vars.CERT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - name: A git archive of the tag, no .git and no tags, on another OS than the release's
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          mkdir -p "$RUNNER_TEMP/archive"
          git archive --format=tar "v$VERSION" | tar -x -C "$RUNNER_TEMP/archive"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ runner.temp }}/archive/go.mod
          cache: false

      - name: The README's recipe
        working-directory: ${{ runner.temp }}/archive
        run: SLICC_SIGN=0 scripts/package.sh "$VERSION"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Every linux, windows and wasm asset and install.sh byte for byte against the release's SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          curl -fsSL -o "$RUNNER_TEMP/release-sums" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/SHA256SUMS"
          verdict=$(node tools/cert-review/outputs.mjs reproduce --release "$RUNNER_TEMP/release-sums" --tree "$RUNNER_TEMP/archive" \
            --rebuilt "$RUNNER_TEMP/archive/artifacts/release/SHA256SUMS" --out "$RUNNER_TEMP/evidence/rebuild.json")
          echo "$verdict"
          case "$verdict" in
            "reproduced "* | "different: "*) ;;
            *) echo "::error::the reproduction printed no verdict"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-verify-rebuild
          path: ${{ runner.temp }}/evidence/rebuild.json
          if-no-files-found: error
          retention-days: 30

  darwin:
    name: release / darwin signature and notarization
    needs: tag
    if: ${{ !cancelled() && needs.tag.outputs.version != '' }}
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: codesign and Gatekeeper on the published darwin binaries
        env:
          TEAM: ${{ vars.CERT_APPLE_TEAM || 'S8LB56P782' }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" -p 'slicc-darwin-*' --dir "$RUNNER_TEMP/darwin"
          verdict=$(node tools/cert-review/darwin.mjs --dir "$RUNNER_TEMP/darwin" --team "$TEAM" --out "$RUNNER_TEMP/evidence/darwin.json")
          echo "$verdict"
          for asset in slicc-darwin-arm64 slicc-darwin-amd64; do
            echo "$verdict" | grep -qE "^$asset: (PASS|FAIL|INCOMPLETE)" || { echo "::error::the darwin check printed no verdict for $asset"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cert-verify-darwin
          path: ${{ runner.temp }}/evidence/darwin.json
          if-no-files-found: error
          retention-days: 30

  verify:
    name: release / verify on npm
    needs: [tag, rebuild, darwin]
    if: ${{ !cancelled() && needs.tag.outputs.version != '' }}
    runs-on: ${{ vars.CERT_LIGHT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: read
      issues: read
      pull-requests: read
      statuses: read
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: The runner's own gh (none is ever downloaded here)
        run: |
          if ! command -v gh > /dev/null; then echo "::error::no gh on this runner: verify is INCOMPLETE"; exit 1; fi
          gh --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        continue-on-error: true
        with:
          pattern: cert-verify-*
          path: ${{ runner.temp }}/evidence
          merge-multiple: true

      - name: The release on npm and GitHub is what release.yml built from the tag on main
        env:
          SLICC_NPM_PUBLISH: ${{ vars.SLICC_NPM_PUBLISH }}
          SLICCY_NEXT_PUBLISH: ${{ vars.SLICCY_NEXT_PUBLISH }}
          WASI_SLICC_PUBLISH: ${{ vars.WASI_SLICC_PUBLISH }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          node tools/cert-review/verify.mjs --repo "$GITHUB_REPOSITORY" --version "$VERSION" --run "$GITHUB_RUN_ID" \
            --wait 3600 --evidence "$RUNNER_TEMP/evidence" --out "$RUNNER_TEMP/out/verify.json" \
            --lines "$RUNNER_TEMP/out/lines.json" | tee "$RUNNER_TEMP/verify.log"
          grep -qE "^certified slicc-cli@$VERSION binaries SHA256SUMS sha256=[0-9a-f]{64} " "$RUNNER_TEMP/verify.log" || {
            echo "::error title=verify on npm::verify printed no certified line for slicc-cli@$VERSION"
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: cert-record
          path: ${{ runner.temp }}/out/
          if-no-files-found: ignore
          retention-days: 90

  notes:
    name: release / write the certified lines
    needs: [tag, verify]
    if: ${{ !cancelled() && needs.tag.outputs.version != '' && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: tools/cert-review
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cert-record
          path: ${{ runner.temp }}/out

      - name: Only the notes edit, from verify's lines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node tools/cert-review/notes.mjs --repo "$GITHUB_REPOSITORY" --version "$VERSION" --lines "$RUNNER_TEMP/out/lines.json" \
            | tee "$RUNNER_TEMP/notes.log"
          grep -qE "^notes: (wrote the [0-9]+ certified lines into|v$VERSION already carries the [0-9]+ certified lines)" "$RUNNER_TEMP/notes.log" || {
            echo "::error title=verify on npm::the notes step printed no verdict"
            exit 1
          }
