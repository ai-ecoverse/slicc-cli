<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <script>
      addEventListener('message', (event) => {
        const send = globalThis.sliccLinkSend;
        const called = typeof send === 'function';
        if (called) {
          send(JSON.stringify({ t: 'offer', nonce: event.data.nonce, sdp: 'v=0 forged' }));
          send(JSON.stringify({ t: 'bye', nonce: event.data.nonce, reason: 'forged' }));
        }
        event.source.postMessage({ called }, '*');
      });
    </script>
  </body>
</html>
